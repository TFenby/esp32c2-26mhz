name: Build

on:
  pull_request:
    paths:
      - 'esphome-web/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-esphome-web-firmware:
    name: ESPHome Web
    uses: esphome/workflows/.github/workflows/build.yml@cc3e76de337dc59bc1cba8da58d963cd23b873f1  # 2026.9.0
    with:
      files: |
        esphome-web/esp32c2-26mhz.factory.yaml
      esphome-version: 2026.9.1
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  upload-to-release:
    if: github.event_name == 'release'
    name: Upload to Release
    # The called workflow uploads release assets; the repo's default token is read-only
    permissions:
      contents: write
    needs:
      - build-esphome-web-firmware
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@cc3e76de337dc59bc1cba8da58d963cd23b873f1  # 2026.9.0
    with:
      version: ${{ github.event.release.tag_name }}
    secrets: inherit
