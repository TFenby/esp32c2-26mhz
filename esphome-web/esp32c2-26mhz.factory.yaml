esphome:
  name: esphome-web-26mhz
  friendly_name: ESPHome Web
  min_version: 2026.4.0
  name_add_mac_suffix: true
  project:
    name: tfenby.esphome-web-26mhz
    version: dev

esp32:
  variant: esp32c2
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_26: y

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

# Allow provisioning Wi-Fi via serial
improv_serial:

wifi:
  # Set up a wifi access point
  ap: {}

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:

# Allows taking control of the device in the ESPHome Builder/Dashboard
dashboard_import:
  package_import_url: github://TFenby/esp32c2-26mhz/esphome-web/esp32c2-26mhz.yaml@main
  import_full_config: true
